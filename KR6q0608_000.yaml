front:
  text: 南嶽山茨際禪師語録序理七虎巖法弟道忞撰孔子以詩書禮樂斆弟子蓋三千焉身通六藝者七十有二人至於默而識之其心三月不違仁則顏氏之子殆庶幾乎然不幸短命死矣深暮所以痛悼之也故曰天喪豫天喪豫又曰惜乎吾見其進也未見其止也嗟嗟墓門有梅有梟萃止矣而九苞之鳳五色之曾畢世而莫之遘者何其中道折翼復創於車子鉏商哉此吾於山茨禪師不能無感傷焉師出報恩老叔之門報恩高臥磬山三十載學者非人物精奇不容廁籌室師以警敏之器英發之資茂齡親炙以迄於壯故師於報恩也固已升堂入室三拜得髓矣而報恩之於師則殆於祐之有寂演之有勤杲之有光焉會恩有東明之命雅推師出世然師心朞方遠大不欲蹈襲時常住未有幾即拂衣去深遁𢖍嶽初止緑蘿菴玄學多歸之以口衆艱於食復下南源三遷一依古德枯淡住持磨礲鈯斧以砥厲方來遂有垂示拈頌若干語皆的的提持本分者著子殊無語言文字與人咬嚼蓋與今時禾黍不陽艷競栽桃李春者迥異矣乃誤服野人之芹竟爾一朝趨寂於乎顏淵死孔子之道失傳師如永年吾宗可倚孰謂鸞鳳竄伏鴟梟翱翔豈真天不可與慮道不可與謀也耶雖然塗毒鼓聲尚未停音當有聞之而命不全活者師蓋未死吾復何憂哉目録卷首序卷第一住杭州府東明禪寺語録住南嶽緑蘿菴語録住長沙府瀏陽南源禪寺語録卷第二拈古代古頌古卷第三機緣法語書問卷第四詩偈詞銘贊歌雜著佛事塔銘附目録終
