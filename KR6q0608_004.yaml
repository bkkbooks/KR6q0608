body:
  text: 門人達剛達旨編次詩偈擬寒山嶺上多古松不知何代種苦寒無改顏鬱鬱披青重時來坐其間掠緑連影共俯察天地間物物皆同夢閒吟一曲歌不是商周頌我有一聯詩醜拙無人和水長見船高泥多見佛大鉢盂口向天大蟲看水磨露柱不出門聖僧只打坐撞著阿家爺一狀俱領過東鄰死老夫西舍生乳子死生自不知傍人乃哀喜看看不幾年哀喜人又死荒郊平舊墳林間添新壘自古到如今誰曉死生理嚴壑幽且深住來年亦久自笑無人知渴飲曹山酒長眠塊石松孤月照我牗落花逐流泉片雲橫谷口仰面問虛空還我萬物母白楊衰草邊高低墳一片當初桃李顏今朝枯骨現不識女和郎安知貴與賤靈魂赴黃泉弗見親戚面寒食燒紙錢徒然空自奠懷淨土丙子夏避暑東明丈室偶披中峰老人廣録見懷淨土十詠語新句麗旨遠義深讀之覺不動跬步使人置身淨域水鳥樹林咸於一彈指頃演出無生忍法豫時逞俊不禁亦𢋫前韵漫成十首聊為執淨非禪執禪非淨者鞭影云紅白蓮池內華開沒下高情殊分品異心淨絶纖毫慈父念無倦迦陵聲有勞紺樓鐘鼓動香靄玉獅髦興念即成迂心空樂有餘樹林珠網色荷水草堂虛佛面花開處天機日出初若能玄會得不必歎歸歟截斷東西路於今誰更論毫端吞日月芥子納乾坤縱目泥犂底橫身生死門莫嫌多意氣淨穢總成恩一法號千差彌陀又釋迦問禪心帶妄覓淨眼沾沙不涉二途客逈開平地華亭臺瑤翠色豈是世榮華彈指開樓閣何曾待語商寶階珠玉潤碧水藕花香浪子歸無念慈親願不忘誰知眼底路即便是家鄉魚鼓聲何處鏗鏘出觀樓鳥和晨磬語人帶暮雲遊池月花間色園林樹半秋但除凡聖念當下便無求觸目通西路往來任縱橫此方才斂念淨域已題名心未超三品身隨位次生樂邦懸憶久孤客好先行野岸荒塘外蓮開又一枝𦮦齊香入座水郭月來時犬馬煙村市禽魚屋樹池緬懷西淨社欲往幾羈遲善法堂前地坦夷潔似霜瑤光明紺宇珠色示隨方人定曉天月鶯啼春夕陽和鈴聲衆鳥日月展空翔懸望憶慈親悲深那計春苦輪舒隻手業海示全身斷妄翻成妄趨真轉失真誰知圓鑑上不受一纖塵山居卜得雲泉處孤危在嶽峰縛茆依曲水闢徑傍幽松鑿沼邀明月編籬禦曉風頭陀生計事一一向人通徙倚亂峰下花香破冷顏蒼黃雲外色病緣雨中山悲鴈凌空遠鳴蟲衰草間飛泉翻木杪澗壑響潺湲溪聲吼不歇側耳轉無聞入理忘能所圓通絶剖分笠穿千眼月衲破一肩雲世外誰知己青山得共云飯飽渾無事經行水石間雨餘聞澗響風靜見雲閒野鳥銜花遠黃猿帶豫還上方鐘鼓寂秋月滿空山寒巖年又盡春到見梅先冷淡柴門色深濃土壁煙飯香沾菜味茶熟帶霜煎偶出沿溪步長歌欲雪天斗室雲窩裏青黃度幾春煙蒸𦮦屋老歲迫髮華新弘法心猶冷隈崖志較親閒吟紫芝可題葉寄同倫行腳曲折溪山路晨行向曉天斷橋橫宿雨孤樹帶寒煙雞犬喧茅店兒童舞墓田行堪白日晚枕月古神前年來生計別得趣道途中乘月行幽徑披雲上遠峰無家同野鶴絶跡似飄蓬市值貪名士相看說苦空萬里無秋草吾行路不賖芒鞋繩忽斷水郭月痕斜獨樹寒塘外閒僧野店家因看童稚戲一學聚泥沙禮黃檗斷際禪師塔草沒塔前路行從流水邊無碑存諡號有地是新田藤瘦荒臺仄苔深古磴連孫枝慙弱羽揮淚拜峰前宿橫山寺山寺藏雲谷松篁翠欲流龍池今夜月霜葉幾年秋人語空林外烏棲屋樹頭殘碑遺聖蹟精舍沐恩庥高皇帝幸寺有作故二句及之南湖青山行已盡萬里又湖天片月層波外孤帆斷岸邊漁燈翻遠浪鷗影落寒煙何處征飛鴈悲聲帶櫓前天台寺亂峰行路絶古寺曉煙傍石磴苔光冷空柏子香僧閒雲外坐猿呌樹中藏斷澗小橋接流泉帶草堂方廣寺荒煙籠廢寺斷碣蔓苔紋日色松間見泉聲石上聞空階存鹿跡記室絶僧文洗衲人歸後池閒浸白雲除夕半生埋澗壑清遠遂閒真煮雪消殘夜推窗見曉春獨憐雙眼碧不厭一身貧深撥爐灰燼紅輪特地新和雲菴文禪師寂寞僧家事寂寞僧家事蕭然坐草堂麻衣遮瘦質菜粥療饑腸去聖時遙遠追蹤志要長忍窮心徹後春到雪梅香寂寞僧家事清閒風味長利名花上露榮寵草頭霜門掩蛛成網林深鳥倚藏安貧求己志白晝枕巖房寄吳九敘居士龐老久無後獅絃委蘚林孤亭標遠韻溪月示傳心重唱團圞句遙知志已深好將吸盡意裁語寄知音示爾瞻尊徒住菴侍吾經五載契合在機先從上宗乘事透徹已無言此去居空谷刀耕火種便鄭重堅操志慧命賴持傳示智閒禪人古寺隱煙林攀蘿破蘚尋溪橋連水色茆屋帶秋陰虎嘯山酬響鶴鳴松答吟端居禪業者安住寂寥心示周思岸居士濁世自思隱携琴入萬峰枕流雙耳潔聞道一心空情冷閒如水身操節並松吾宗言外旨任運好參窮出龍鬚辭高峰祖像侍師三月餘野𬞞充腸腹師唯默無言誨我良已足面目似巉巖冷落清可掬九年折腳鐺一味瓔珞粥墮枕痕尚存古今憑付囑爇香別師行草鞋破苔緑似師吼不能體師住茅屋初至嶽山尋友不值作此待之寰宇多名山嶽𪋤稱幽獨峰寒白日暝林藹蒼黃緑豫有素相知于中結茅屋柴扄抱樹開路取溪水曲瘦石支斷雲短籬綻秋菊我遠辭西湖尋君來此谷胡為君出先空我草堂宿月色冷泉聲長夜徹耳目枯坐不成眠孤情起腸腹何日握君臂遊遍山南比答招我本愛林泉遂成煙霞癖結屋𢖍山巔孤鐺支瘦石暑寒兩度過青髮數莖白髮白非無因良以履道迫枯坐薰風中忽見故人策相對開笑顏幽懷頓然釋徐申招隱言有山稱最僻曾為曉了居橡栗充腸食無縫塔樣新今古仰標格君既著眼看架屋伴流碧且以此延余訂盟圖閒翮我當學聚糧赴斯傳擔宅山居結屋依林曲開門抱雪溪石床午睡起眼聽竹雞啼洞深雲出晚澗曲水流遲茆屋無人到年窮亦不知示參禪參禪要孤峻祖佛休容近踏著上頭關家親一時順參禪無久近一悟以為期未得心花迸休言更不疑參禪忌雜學學雜悟難期不見香嚴老焚書上遠溪參禪宜志大莫喫人涎唾流出自胸襟吾門堪紹荷參禪莫執坐坐易過時光語默安危裏通身在本鄉參禪絶攀仰直下常光朗坐斷聖凡情惟我無儔黨參禪要心切切則情緣歇覷破未生前靈然如皎月參禪須守志莫使利名牽不到徹頭處當機滯語言立法派偈通達本來法宏開祖道隆慧燈恆永照證悟了無窮山居繼隱菴成天半秋新泥土壁濕難收時添黃葉埋爐竈常有青煙透屋頭疊足石床知念冷閒行雲路覺情幽從前撩倒俱忘却水草便宜且放牛空谷今年春事饒寒巖高下綻花嬌碧桃石澗新舒葉黃獨溪園近長苗竹拍晝鳴驚兔屬煙光夜舉嚇猿曹營為盡是居山計鋤月耕雲不憚勞萬峰雲薄淡溪光白晝花陰覆短墻潄石泉香苔面雨上林秋老碧天霜農歌未似樵歌遠鶴韻爭如松韻長歲事目前從變幻癡憨贏得枕巖房草堂近搆得雲饒亂石旋支瓦罐燒緣愛清風多種竹欲因漁父盡栽桃掛冠靖節非為樂把釣嚴陵未是高得似山僧真活計飯餘倚杖數猿猱法道寥寥不可模一菴深隱是良圖蘿痕牽月當巖竇花木披雲傍草廬白畫蒲輪閒味遠晴巒扶策野情虛寒泉噴玉峰頭落竹筧分流直到厨曉起青桐片葉黃始知秋已到巖房泉香涓滴藤花雨峰色凋殘月夜霜弊衲半肩新線眼垢容亂髮舊行藏菴門不作心心字一任諸方說短長閉門欹枕守閒閒薄暮開窗看鳥還弘法志頺因病久利生心冷為時艱踈慵只合棲巖谷拙直何妨對晚山一卷雜華經讀罷月明深夜坐溪灣空林白晝半開扉雞骨稜稜懶應機對鏡病容同鶴瘦臨溪撩髮羡鷗肥萬緣盡處心無事諸念空時性愈輝靜坐爐香酬日永任從窗外落花飛除夕巖壑悠悠又見春燈前撩髮覺華新平生安分成無用劫習消磨獨剩貧遷隱幾番同似夢浮名半世冷如冰地爐煮雪除殘夜坐對瓶梅倍有神送崇北無文兩兄歸里草鞋同碎磬山前痛癢深知語脈玄踐履肯隨浮學士臨機不讓古南泉孤裝正值新秋月遠水欣逢曉寺煙帶郭有家松舍隱無忘茆屋石流邊贈同參遷隱住老雲山恨不深又移茆屋入幽岑破衣結剩三條篾折腳鐺煨一世心擇法眼高秋夜月當場機峻截流音任從白髮垂雙耳瀑水崖前坐獨吟寶峰禮祖塔珠峰高下老藤蘿積翠香寒窣堵波石筧水流揚古路斷碑苔蘚閣荒坡支那空濶宗猷遠法苑庭深花氣多八十四人逞好手絶誵訛處見誵訛車牛拽脫鼻撩天赤骨神驅面目全踏處血痕腥徹底當陽棒指未生前四宗俊傑從師足遠派清流出泐淵慚愧兒孫無可似追風結屋老林泉百丈月下懷古拂袖人歸月未歸清光如潑萬山暉青桐葉掉今時事曲水聲長舊日機桂子寒風香落枕石幢秋露濕沾衣追思獨坐峰頭句捫葛攀蘿到者稀謁楊岐會禪師塔亂峰幽鳥語如篁灼見師慈舌未藏孤塔荒臺林壑外深苔斷碣石流傍霜寒屋老差如舊典式僧儀屬已忘九拜傾誠通血脈秋花片片綴衣香途中即事囊無半個草鞋錢赤腳登山亦快然秋雨秋風千澗外一笻一笠斷橋邊林煙射日人炊晚瓶鉢孤村我乞便最遠草菴叢樹裏到門問宿隔流泉寄黃介子居士野性偏宜載月舟不施櫓棹任風流煙波擲釣三湘曉宿雨開眸兩岸秋點筆窗前無字腳酬機橈下有昂頭轉身句子須當委劈破江心白鷺洲和雪嶠老人韻挽天童密老和尚眉間劍氣倚天長豈許癡人戽夜塘月落峰頭愁法海梅空石室悵雲鄉雙池水活清流遠太白風高道價香遍界全彰真面目孰云師不在虛堂和澄靈散聖山居偈因僧問我西來意向道居山不計年衲破結稀通露骨髮長鬔亂半垂肩開畬種粟移雲石充腹炊羹掬瀑泉一夜澗生風太急竹籬吹倒在門前和雲峰悅禪師偈道薄常慚繼祖猷自甘巖谷老春秋地爐夜遠知無火撥盡寒灰未肯休道薄常慚繼祖天癡憨只合枕流泉煙波果有金鱗現擲釣無容更向前道薄常慚繼祖燈巖龕枯坐百無能髮長衣弊臨溪照半是樵兮半是僧道薄常慚繼祖心高山流水是知音𢖍門擁滿霜黃葉冷落清光徹古今道薄常慚繼祖門年來堪笑一身貧有時乘月窮峰頂坐對南辰看北辰山居茆屋尖頭雲樹裏筧泉涓滴地爐邊客來不用山儂道拭目家風總現前抱卷蘿窗坐日長興來詩愛和支郎平平仄仄書蕉葉翰墨淋漓滴翠香樹凋葉落秋將盡貧者無依似絶倫破衲頭穿雞骨露獨憐風調合雲門樹樹花飛向晚風子規聲倦月明中山翁不放春歸去枯木枝頭㫰曉紅破衣亂髮一身輕菜飯香生折腳鐺本色住山甘落寞竹籬秋月十分明竹窗斜抱亂峰開白晝猿啼睡起來花落石溪流出遠幽禽自惜又銜回離東明辭杭湖兩郡護法祖事業今成矣瓢笠何妨又別遊廬嶽山山春正好閒身隨處臥雲幽道薄不堪居祖室合隨雲鶴聽潺湲從教別選僧中德可使重拈六尺竿寄箬菴法兄一關深鎖竹窗靜千嶺寒松節操長遙望故人行道處九溪百尺浪花香先師一句分明語君聽全兮我不全昨夜南薰報消息大人峰吼斷雲煙挽真寂聞谷大師三更月落在苕濱法海波騰倍慘神自是吾師悲願重特垂雙足示何人夕陽花鳥轉身虛夢斷寒梅香有餘六字攪渾清世界不知得法幾人歟送印乾兄之天童春水春山拽杖藜喝風棒月任施為相逢太白峰頭老一笑從他一衆疑懷玄慈爾瞻二徒曾期伴我住青山底事而今未見還坐到嶽樓鐘寂後殘燈剔盡几屏間百丈晚步行行十里竹溪邊鷗鳥情閒導我前拭目大雄峰頂立半含斜日半含煙書遠公影堂支那蓮社師初闢十八高賢自到來鑿石山根池有水藕花何日又重開三笑從教笑不休寸田何處著閒愁下方月是上方月今在層峰第幾樓宿福嚴寺行盡千峰與萬峰亂雲堆裏梵王宮篝燈一宿松窗下臥聽空山答曉鐘謁祥菴主塔楖𣗖橫肩俊不禁晴峰丹壑阿師心只今未諱當時句枯雪藤蘿積塔深尋積翠志感野雲未肯屬人家來去飛騰傍水涯我欲支笻何處是蒼苔踏遍夕陽斜滄浪釣臺孤臺聳峻倚江波為問滄浪覓釣蓑最是使人憐絶處水煙深淺白鷗多繼隱菴進火借得嶽南山一片縛成茅屋伴雲閒今朝拈起無煙火朵朵晴峰開笑顏除夕設磬山先師道影燒香初住草菴無別物清香一瓣一杯茶惟師鑑此貧兒意豐儉從來出當家佛成道日獻粥偈只此殘羹是你留今朝還獻嶽峰頭別無滋味休嫌怪直下兒孫不外求遷隱口占寄玉林法兄先師不了舊公案擔荷全憑過量人愧我癡憨無可似青山縛屋伴雲間除夕示諸禪人雪冷雲窩一歲凋林泉無物度今宵白牛吾久添香草就地烹來供爾曹喫糠餅示衆衲子身貧道不貧日餐糠餅養閒身因思佛祖當年事麻麥曾經過六春寒夜地爐不斷霜黃葉擁衲垂頭入夜烘月到竹門生線影橘皮湯煮喚山童寄懷玄慈謙子結得雲中一把茆半間虛久待兒曹鴈回不見通消息日對傳燈伴寂寥採茶肯教枝葉向今時帶露披雲盡剪除留得孤根全體用不招風雨自如如初度日偈今朝午夜娘生我我出頭來不見娘不見不生端的現我娘面目露堂堂咏梅巉巖石壁自甘心一種孤根透古今玉蕊半開香已漏任人拗折任人吟咏笋懷虛抱節肯隨流時候相臨不自繇一夜狂雷春雨後崩崖裂石便昂頭釣石在緑蘿菴前坐此嘗拋釣月鈎金鱗罕遇未甘休𮈔綸漫整添雲餌冷眼餘看萬壑秋龜石在繼隱菴前煙波涉盡潛峰頂堅石心腸絶見知珍重嶽遊雲水客脫鞋莫學大隨機別龜石三春與爾作閒遊彼此情忘冷似秋今日我從巖上去好藏頭尾住林幽會仙橋斷橋橫架接天河石蘚苔痕鶴跡多聞說黃龍收劍後仙踪不到此間過飛來船時淨公結茆船下載月嘗停在萬峰片雲斜倚似飄蓬披蓑不計𮈔綸事高枕船頭看日紅簡徐大玉太史今日宰官昔日僧心光體露可傳燈遙知散步梅花下手握天台七尺藤憶昔風霜訪澗濱絶塵清韻迫幽人只今萬里溪山路夢會維摩一似真簡黃西岑居士宦情冷處道情真贏得雲山伴此身聞說蒲輪嘗疊足何如石室坐禪人杜口維摩句灼然想君已契在機先吾宗別有通玄處石女懷胎古澗邊示余猗叔居士選佛場中及第歸林泉逸老麈嘗揮虛空也解知端的頻散天花落翠微末後玄關不易開從教徹底透將來太阿嘗握當人手劫習塵情直下灰寄談貞復居士多載神交道味長尺書往復見行藏何時扶杖祝融頂同看秋雲宿草堂浮名情冷道相親正好參窮識本人吸盡洞波底月龐公即是現前身寄李季侯居士本是無羈法性身瞥生知見昧當人應須坐斷言思路徹底無依是正因分明此道絶西東雲月秋光處處同觸目若能親薦得不妨千里自同風謝湯若玄居士惠餅雲門糊餅君拈出灼見風流是當家滋味果能親咬著不妨來喫趙州茶寄余禋生居士林園軒宅試科場題目分明文彩彰拈起毛錐如薦得灼然不是探花郎寄陳若時居士鴈回翮倦瀟湘遠喜接音書信息通夜後一輪峰頂月清光倣佛對君容示玄慈謙徒住山羚羊挂角杳無踪瞬目揚眉仍舊容此去青山住茆屋白雲堆裏好藏鋒寄見渠禪人時奉命較刊續正法眼藏玉振金聲祖佛言流通全籍是英賢少林不斷真消息晴雪孤梅開澗邊示見菴禪人見也全身入此菴清風明月影寒潭個中消息未能委按下雲頭好力參示衆禪人開山野地閒田荒積年無根林棘草芊芊一鋤翻轉連雲石本有靈苗總現前聖賢自古隱巖阿雨種雲耕博飯多盡力荷鉏歸帶月管教名字挂煙蘿挽玄印禪兄鐵牛吼斷月三更七十峰頭萬象驚正值雪消春水候千溪流出帶悲聲寄友自君別後入雲深月下風前幾度吟除却青泉與白石更無一個是知音示夏調生居士行腳春風吹春鳥啼問道憧憧曳杖藜錢塘江水深且清波心明月照當人失腳一踏踏破了白雲不敢白青山不敢青兩岸鷓鴣不歇口那個途中解知有大丈夫兒合自繇莫落人前與人後太白老漢徹底窮通身面面皆玲瓏君去須當高著眼從教薦取主人公咄示德禪人歸里霜天一片霜月一輪回頭轉腦換汝眼睛雲鴻一聲兩聲江浪千層萬層到得家鄉忌鄉語鄉語令人傷離情衲僧家行履別斬釘截鐵沒途轍去來古路腳跟頭踏著山河成片雪咄山居六言絶句雨過晚山稠翠雲收夏木陰穠北窗讀罷殘卷明月已上孤峰白雲一片兩片黃鳥三聲四聲自是吾家好境從教人看人聽鐘寂月來時候定回茶熟剛香推開竹門兩扇誰道光境雙忘衲破通身雲片笠殘滿眼煙痕年來更是貧甚置錐之地無存詞漁父詞𢖍嶽殘泉懷祖四尊宿俱當時未據叢席者其清風高節千載下猶津津播人齒頰詎非道德持守所致耶比見諸方荷法之士往往以叢林為榮位之所獻書投幣局蹐朱門希求薦舉豫聞之不覺掩鼻遂作此詞一以懷四尊宿一以自警耳懶殘巖主性懶隈巖常獨坐中宵梵唱花雨墮旁舍書生來見過遭折挫十年宰相先說破糞火芋香流涎唾大唐天子不知大紫泥覿面無心和名轉播清風明月相磨磋谷泉菴主親見汾陽傳法要南山歸隱還執拗紛紛大雪蹲崖呌仍含笑譏呵祖佛不知妙紙襖離披非作造酒瓢拄杖隨身靠月下有僧來問道猛推倒驟步峰頭聽猿嘯石頭懷菴主曉霜秋澗阿師面道骨氷崖成一片雲菴句子終身踐無所羡緑蘿丹壑適其便麻衣枕月酬閒倦石頭路蔓蒼苔遍直教衲僧忘馳見誰能薦晴峰朵朵寒空現祖菴主閒身折腳鐺隈老坐斷乾坤無邊表千峰日出虛空小披雲曉吹耳松風清皎皎飯香菜熟時正好一補饑瘡諸事了遣興吟詩露牙爪分朕兆師僧來往溪山道銘三老泉銘有序崇禎戊寅卜居擲鉢峰下縛茆既就而艱於水披荊躡危潺湲之聲出於巖巔峰際了不與吾廬相涉遂快快歸有頃復策杖往室左龍岡石下有聲出焉捫棘視之垂珠噴雪較蘇長公評海內諸泉浮玉惠崖皆落下乘矣次日復携一力向石根苔葑處積葉荒苔用鉏剖之又得兩眼大如錢涓涓流出同歸一石池豫解頤顧力者曰日浸白雲夜含明月自今日始子為我深浚之且昔亞聖若慧思神鼎大覺俱先後繼隱此峰今吾得此泉源本于一而流分為三吾以三老泉名之不可以無書遂志之以銘曰塊石三泉出自一源供我爐鐺日流涓涓思鼎大覺三老名焉源頭既合孰云後先贊馬祖一禪師讚有序洪州石門寺大寂遠祖開山處也峰巒攢簇溪水回環豫眼底所歷禪林未可以一二數寶珠峰下影堂在焉瞻祖遺像謹稽首為之讚曰車牛打處直出向前不滯枝葉見道根源敷演密意說醬說鹽親沾滋味八十四員龍驤虎驟雲起風連千載旦暮想茲時焉豫來山谷拜師幕簾堂空月皎爐冷煙寒師豈無意攝受後賢百丈海禪師讚有序祖道初興未有禪室安學者瓢笠之士俱雜寄處祖慨然憂之曰欲吾道為世法世則豈可無禪室以安廣衆耶於是登洪州百丈山伐木架屋鑿石開田凡安衆所宜者畢僃繇是湖海衲子雲歸川赴駢集而至座下恆幾萬指復依律部刪繁取要演為清規以肅四衆示道不離威儀動靜也嗚呼吾祖憂法之心深矣至矣吾徒不力踐而行之將何以報祖德乎豫獲至山得拜祖像因為讚讚曰大法初興惟師傑出昨笑今哭機用迅疾鶻眼莫窺龍睛安識廬室塔傍示師承則直上大雄澗飲橡食水雲駢至寧容自匿撾大法鼓羣疑頓息野狐黃犬咸令脫質廢其律居易以禪室演習範儀為叢林式豫恨晚生不同師出授我心法驅我凡惑今拜其廬瞻承顏色冰雪凜然殊俗浮習作此讚詞冀師一識慈化禮普菴禪師塔有序禪師牧菴嫡子臨濟遠孫其應機說法殆若嚴陽華林輩得法自在超放絶倫乃世往往以神通僧目之不知師乃古聖乘願而起現人間世紹隆佛種攝化羣品實如來使也豫見後之繼傳燈而作者亦以師為神僧刪而不收識見暗短至此悲夫豫至慈化山禮塔占一律以告夫未知師者師乘悲願力起作世燈幢神運因機感靈通為法彰鐘聲緣禁寂柏老落寒香窣堵縹花雨應知攝受長面壁達磨像贊不契梁皇殿上機却來石室峰前坐一言脫賺可大師簡點將來成話墮不話墮巖雪紛紛落夜寒千山孤鶴清聲過磬山先師小像贊枯樹一枝兩枝蒼石三點四點就中坐著阿師手握烏藤勘辨當時幸自貧兒不是幾受你賺咦中興臨濟更有誰海上橫行真法範歌和五祖演禪師牧牛歌庚辰繼隱菴作我牛不向前安樂臥閒田騎出溪邊牧雙角指青天任西東無欄圈水草家山處處便皮毛一色月明中遇賤則貴貴則賤帶露披雲呌一聲大千頭尾俱顯現山中四威儀山中行信步踏斷水流聲穿林去驚起松梢孤鶴鳴山中住一間𦮦屋依雲樹飛泉來潤我疄頭四時蔬山中坐月明野鹿菴前過忽鐘聲童子敲魚讀功課山中臥新結蒲輪鋪一個倒身眠縮腳自知被底破十二時歌一日日十二時使得乾坤無定期道人不逐時遷轉翻轉十二時不知半夜子老鼠偷油上書几燈盞臺盤盡打翻一點不曾沾到嘴雞鳴丑三世諸佛不知有夢眼糢糊半未開笑破狸奴白牯口平旦寅下床著襪腳才伸無位真人開口笑踏瞎燈籠隻眼睛日出卯赤腳波斯穿市早無底籃盛鱉鼻蛇逢人放出遭他咬食時辰野菜充腸不厭貧一飽忘饑呌快活橫拈楖𣗖指迷津禺中巳機巧渾無反成智三寸龜毛拂柄長鶻眼龍睛被鈍置日中午四三二一從頭數毗婆尸佛早留心直至如今還呌苦日昳未也解隨羣并逐隊手携達磨破皮鞋遇貴則賤賤則貴晡時申也無煩惱也無嗔擎回一鉢煙村飯供養瞎驢七尺身日入酉閉門喚歸子湖狗家常茶飯餧渠儂佛性有無不相偶黃昏戌簡點從頭無一實拍手呵呵笑轉賖不如念個波羅蜜人定亥伸腳長眠忘管帶和雲明月到窗前個裏那有乾坤在在不在蟭螟眼上添眉黛風光只麼日如常擬問將來韓獹逐塊雜著刻東明旵祖遺録序鼻祖西來直指之道六傳至曹溪出南嶽青原二宗南嶽再四傳出臨濟臨濟直下師師相授至東明旵祖又歷二十三傳矣旵祖以上諸老語録機緣皆見於世獨旵祖録未獲見乙亥仲秋黃海岸司理偕唐祈遠居士以東明虛席致書報恩先師先師以病却命余應席余勢不容辭拽杖趨赴偶一日理破笥廢紙得祖法語機緣偈贊并塔銘若干篇焚香展讀宛如覿面親承其言簡而直捷不啻雪巖高峰語也昔建文君自遜國後亦匿影此中遺像存焉往往名士禪衲弔舊君禮祖塔題詠滿兩廊壁間於是録出並所得旵祖語用付梓行以表祖初闢知達磨直指之道代不乏人也南嶽禪燈會刻序吾祖之道五傳至曹溪派分為兩一曰南嶽讓出馬祖一一曰青原思出石頭遷自兩派下又分而為五宗五宗既分燈𦦨並熾其匡徒說法據南嶽者為最多余戊寅春既解項上之枷乃得匿跡茲山居繼隱草菴間有老師大衲相過余每叩以茲山先哲道德言行之巔末往往無有知者因慨然太息曰既居此祖窟而先哲道德言行莫之能曉平日將何以為治心之師哉由是遂發大藏探閲傳燈諸録凡屬七十二峰或握拂升座或抱道幽棲於吾祖之道師承有據法眼圓明者摘出百有三十三人其機緣法語偈頌傳銘亦若干篇彙成八卷題曰南嶽禪燈會刻其語悉依舊本未敢增損皆先哲導迷返悟要旨之言既非余臆俾行於世有何誚歟冀出格英靈向一言一句直下擔荷高懸慧日重振祖風此余集是録之望焉送石林兄歸廬山序震旦清平世界被達磨老胡特地西來攪得七橫八豎以致纍及神光立雪斷臂黃梅假宿投胎曹溪墜石舂米踈山賣單行腳雖然抑是珊瑚枕上兩行淚半是思君半恨君詎料千有餘年餘殃未盡纍及余友石林拋却匡廬三十六個峰頭橫擔拄杖緊絆芒鞋遍走江湖歷參知識今上癸酉余侍先師度夏于烏瞻法濟院值公參禮先師繇是遂相交臂同遊先師之門至乙亥秋暮余領東明院事適公居真寂丙子春復移錫東明共余喫苦菜看飛雲已而復與言曰苦菜一莖誰咬著從教百味也俱全莫嫌待客家風淡能瀉諸方油膩禪公以為然一日別余言歸余曰三十六峰點頭望公久矣但拭眼堂前鱉鼻蛇久藏深草幸公為我驚起念佛鏡跋邑居士近嶽談公從友人得念佛鏡一帙其書為大行尊宿所作直指唯心曲談修證吾儕有志淨業者得此不啻迷途之指南也居士欲重付剞劂以廣流通寄語山中徵豫為敘豫習禪者淨土一門罔諳厥旨遂據吾宗聊釋之曰身口意清淨是名佛出世身口意不清淨是名佛滅度又有曰如何是佛即心是佛又有曰如何是佛光頭赤腳又有曰如何是佛眉橫鼻直又有說者曰盡大地是沙門隻眼盡大地是當人自己盡大地是摩訶般若光盡大地是一古鏡繇是觀之則衆生與佛未嘗須離淨土也然先聖證而忘之忘而用之故日用觸事而真運水搬柴皆是神通衆生迷之故日用觸境情生情生而忘熾又豈能證而忘之忘而用之哉於是勞我迦文老子興起而言曰若人一心不亂專持名號疾則一日遲則七日即生彼國雖然天衣懷和尚曰生則决定生去則實不去若人向此薦得打破鏡來山僧為伊別通消息無文說豫友印兄號無文徵豫說豫曰既是無文安有說乎雖然吾為兄借事而強言之兄亦就事而強聽之天地未形謂之無天地既形謂之文日月往來于東西禽獸飛馳于上下白雲宜山則止流水宜川則行雖物之適性之不同類皆文也空劫自己謂之無自己空劫謂之文將一莖草作丈六身不為優將丈六身作一莖草不為劣移須彌入芥子不為狹移芥子入須彌不為廣鳥卸花落不為色溪吼雷轟不為聲此則又文即無也無即文也是以空生宴坐帝釋雨花淨明默然文殊贊善兄之無文其斯之謂乎印笑而不答豫乃閣筆募刻南嶽禪燈會刻祖佛未生前一著此録全彰德嶠不會底這機斯文漏泄百三十人向此說長道短千七百衆咸來合掌低眉打車是打牛是賺殺神駒是你非是渠非纍疑晟老當時只解覆藏今日正宜揭露遇騎鶴客來解腰纏之錢吾事濟矣比雪山童子捐軀求偈厥功懋哉明知印板上刷來先要刀刃頭迸出讓師古鏡鑑空聖凡迷悟之情遷老碌磚打破死生夢幻之執公案注腳分明祖師面目現在流通句內功德莫窮堂榜般若禪林廣堂社內非啞羊之得處乃威鳳之所棲第邇來行腳者無正因為道入此禪林有以學機鋒轉語當參學者有以做拈頌詩偈等當參學者有以致身禪林隨羣打哄當參學者有以飲食次第湯火穩便偷安衆中當參學者有以出此入彼傳言送語爭鬬是非當參學者嗟嗟禪林之衰替祖風之不振皆此輩咎歟今則凡我同居當照古風以真參實悟為懷囂浮掠虛為戒使覺樹凋而再春滹沱涸而復漲此山僧之望馬佛事為破愚師下火師云七千里外來南嶽腳下無私又別遊勝熱門開君好入通身紅爛始風流攛火炬云火裏泥牛銜月走為我尊禪人下火師云腳跟下事曾親踐腦後常光徹古今以火炬打圓相云這裏若能親見得十方世界現全身塔銘附臨濟第三十一代南嶽山茨際禪師塔銘并序曹溪大鑑之道傳自南嶽青原雖兩桂並昌而濟宗特盛臨濟傳興化南院風穴首山至圜悟勤虎丘隆為十一傳隆傳應菴華華傳密菴傑傑傳破菴先先傳無準範範傳雪巖欽欽傳高峰妙妙傳中峰本本傳千巖長長傳萬峰蔚蔚傳寶藏持持傳東明旵旵傳海舟慈慈傳寶峰瑄瑄傳天奇瑞瑞傳無聞聰聰傳笑巖寶祖則又臨濟下第二十八世也寶祖傳禹門師翁師翁傳磬山先師從先師者如雲而沉毅英特為時所最重者有山茨際公其人實不愧為師門嗣已師生通州李氏諱通際號山茨別號鈍叟父某有隱德母某氏事佛惟謹茹素浹載而孕師甫周能別葷素通之天寧有鑑川老宿往來師家語師父母曰季子幼齡殊道器盍捨從吾遊乎復有相士見之曰此子骨格超凡匪出世不能永年以故才志學父母許從鑑川老宿敦沙彌行寺有若昧法師開法講演師遂得習講座下每聆無常迅速語即自𪫟惕一口氣不來向甚麼處安身立命雖歷講非志也而此念獨諄至忽一夜經行偶失足殊覺有所省入奮志參方首抵金粟參密老和尚受具戒旋謁先師於磬山時年才二十見問昔日聞風今朝覿面覿面一句請師分付先師云你試道看師禮拜擬出先師云却當不得師便出一日室中侍立先師拈如意云我打你你却痛擊香案云我擊香案你因甚却不痛師作負痛聲先師呵斥云野狐見解叱出師竦然親依丈室者三年偶歸省途中聞二僧舉長生靈雲問答機緣至打破鏡來相見處豁然大徹旋還磬山先師覺異之一日先師問百丈再參馬祖喝下得箇甚麼師云若有得即鈍置馬祖也先師云他道三日耳聾聻師云某不可更作野狐精見解先師微笑從此針芥相契入室商確無虛晷師齡稚少行致孤卓人咸畏憚之先師繇磬山遷法濟復繇法濟遷報恩師皆典客執勞輔弼身居衆先雖祁寒溽暑弗懈也乙亥秋先師示疾適武林司理海岸黃端伯以東明祖剎致先師先師乃命師云老僧病軀不能久荷衆汝侍老僧且久各行一路無滯此遂復司理書以師代入院司理聞之欣然相訪見次師問聞居士在開先推倒廬山是否士云師還見廬山麼師云待公扶起士云乍換東明師云作家作家士問大師一向在甚麼處住師云居士道山僧即今在甚麼處住士云出此門不得師云居士還出得此門麼士擬議師云却是居士出此門不得相與大笑稱善緇素歎服師初住嚴峻自持瓦老雲寒破椽不蔽肅如也越三年而規制稍就粗成舊觀忽師蟲以盜占祖塔會之紳士力陳當事為師圖復師喟然曰夫沙門以無諍為德吾不能以德化而藉護法以力爭滋愧矣曳杖宵遁竟歷匡廬躡洪崖遍禮寶峰石門諸祖塔直登祝融周旋擲鉢峰喜其崖石林立拔地千仞縛茆以居曰繼隱以昔思大神鼎大覺先後住此示志同也山中諸老宿聞之咸相給供復為廣其室曰緑蘿師常問諸老宿此山從上法脉洎先德典型與機緣出處漠無知者於是托拾新舊嶽志所載百有三十三人彙集成編曰南嶽禪燈録以示諸老宿魚山熊給諫序而傳之云是集行當必有從紙縫中劈開面目者復續集宋元明興諸老宿機緣法語以附大慧正法眼藏後凡若干卷謂衆曰此吾徒慧命所寄也甲申夏兵革騷動林谷震恐發足下山麓抵清瀏水陸俱困迂途至南源就南源駐焉嚮風奔趨者且日至師景百丈一日不作一日不食之訓躬率衆開田拾枯掇野誤食澗芹致腹困乙酉夾鍾之八日同衆作務如故晚忽令侍僧淨髮沐浴端坐逝嶽之老宿哀痛悲戚如喪考妣力請龕還嶽遠近號泣為營塔於緑蘿不負師幾生夢在緑蘿菴之意也師賦性恬靜氣度閒雅律身嚴謹事事法古人其接物也無智愚貴賤和顏禮敬純誠慈愛出自性成故見之者如披拂春風雖耆年碩德不自知其意之消氣之折矣師生萬曆戊申七月十一日坐夏二十有四閲世僅三十有八叢社寥寂良木摧萎豈其法運凋薄使哲人不永其年以為後學表式耶憶先師生平不濫許可僦居磬山寒爐擁葉嚙冰雪相向者僅惟數人𢌿以祖弘荷大法食牛之氣衆所躃易方且以思大之目瞪雲漢為師激切而南源絶流寧能免夫人之慟與諸祖列宗面目現在師其果滅耶余與師知最深歷事始終最久審師大端固非余不能殫悉也昔與師有同龕之訂既全身入塔於嶽山之巔死生出處知緣自有在耳所著語録若干卷已為刻行門人達尊達謙達芻達剛達旨持狀諄懇不惜蕪陋復僭為之銘曰大鑑之道南嶽其昌聿興濟宗後先光揚傳三十葉實維磬室如雲從龍英英赫燁同室為誰山茨際公針芥相契乳虎稱雄巖巖東明日午方卓重昏不迷羣陰自爍力弘祖道魔孽永殄胡為潔然而乃遠竄既以法住亦以法行始終以法自繩其身瞻彼祝融拔地而立擲鉢峰高繼隱是式厥揚祖德克紹一燈開正法眼以豁羣盲嗟嗟南源忽焉涸澤驚倒𦒿林痛摧良木師名不沒師道不泯窣堵孤巍真風凜凜衡嶽千載得師孔彰勒我貞珉識師不忘時歲在壬辰紀纏鶉火之次武林南澗同法弟通問和南撰音釋跬犬繠切音頍與䞨同舉一足曰跬半步也綴株衛切音錣連緝不絶貌篝居侯切音鉤以籠覆燈火也疄離珍切音鄰壟田也浹即協切音𠗉周也
