body:
  text: 門人達尊達謙等編次拈古舉世尊才生乃一手指天一手指地周行七步目顧四方云天上天下惟我獨尊雲門云我當時若見一棒打殺與狗子喫貴圖天下太平師拈云此則因緣古今評論不勝其數矣山僧今日不敢再加一辭何故字經三寫烏焉成馬舉世尊因自恣日文殊三處過夏迦葉欲白槌擯出才拈槌乃見百千萬億文殊迦葉盡其神力槌不能舉世尊遂問迦葉汝擬擯那個文殊迦葉無對師代却是某甲罪過師拈云文殊三處過夏只見錐頭利迦葉白槌欲擯不見鑿頭方若非迦文老子大慈大悲怎容得這般漢在座下舉世尊一日升座默然而坐阿難白槌云請世尊説法世尊云會中有二比丘犯律行我故不説阿難以他心通觀二比丘遂乃遣出世尊還復默然阿難又白適來為二比丘犯律是二比丘已遣出世尊何不説法世尊云吾誓不為二乘聲聞人説法便下座師拈云世尊索馬阿難奉鹽雖然鹽馬不同要且共為標準黃靣老子云誓不為二乘聲聞人説法又作麼生話會片片落花隨流水流水無心戀落花舉世尊在靈山會上拈華示衆是時皆各默然惟迦葉破顏微笑世尊云吾有正法眼藏涅槃妙心實相無相微妙法門不立文字教外別傳付囑摩訶迦葉師拈云世尊拈華迦葉微笑正恁麼時且道世尊與迦葉在那裏相見若向拈華處相見則蹉過釋迦老子若向微笑處相見則蹉過飲光尊者有人向這裏定當得出山僧施四大作繩床而供養之舉九峰在石霜作侍者石霜遷化欲請堂中第一座接續住持峰不肯乃云待某甲問過若會先師意如先師侍奉遂問首座云先師道休去歇去一念萬年去寒灰枯木去古廟香爐去一條白練去且道明甚麼邊事座云明一色邊事師別鳴指一下云只明這個事峰云恁麼則未會先師意在座云你不肯我那裝香來乃焚香云我不會先師意香氣騰處脫去不得言訖便坐脫峰乃撫其背云坐脫立亡則不無先師意未夢見在師拈云這則公案自古迄今拈頌者如牛毛見徹者如兔角以致石霜父子兄弟血脈參差家聲魚魯山僧今日見處也要諸方共知殊不知首座侍者一人暗藏春色一人明露秋光同聲相應同氣相求發明石霜不傳之祕大衆還委悉得麼大鵬只管騰霄漢那顧迸開六合雲舉百丈海禪師每日上堂常有一老人聽法隨衆散去一日不去丈乃問立者何人老人云某甲於過去迦葉佛時曾住此山有學人問大修行底人還落因果也無對云不落因果墮在野狐身今請和尚代一轉語丈云汝但問老人便問大修行底人還落因果也無丈云不昧因果老人於言下大悟師拈云前百丈云不落因果端的端的後百丈云不昧因果端的端的既然如是因甚有墮有脫若向這裏緇素得出始可克紹宗乘權𢖍佛祖其或未然盡是野狐精見識舉南泉住菴時一僧到泉云某甲上山作務請齋時作飯自喫了却送一分來其僧齋時自辦喫了却將家事一齊打破乃就床臥泉伺久不來遂歸見僧臥泉亦去一邊臥僧便起去泉住後云我前住菴時有個伶俐道者來直至如今不見師拈云南泉雖是本色住山乃有不施寸鐵便能陷虎之策者僧固是行腳英俊終是貪人香餌落在彀中雖然如是要見這僧則易要見南泉則難舉寒山預知溈山來國清受戒遂與拾得往松門接溈山才到二人從路兩邊透出作大蟲吼三聲山屹然無對師代云這畜生寒山云自從靈山一別迄至如今還相記麼山又無對代云瞌睡漢拾得拈拄杖云老兄喚這個作甚麼溈山又無對代云瞞阿兄不得寒山云休休不用問他自從別後已曾三生作國王來總忘却也師拈云溈山忘却且置而不論只如寒山拾得記得底事又作麼生豎拂子云可來白雲裏教你紫芝歌舉甘贄行者開接待凡有問行者接待不易者云譬如餧驢餧馬琅琊云快把飯來五祖云願行者長似今日師拈云行者接待亦是好心亦不是好心琅琊雖是看孔著楔未免飢虛迫人五祖善鑑來機終是貪他小利山僧即不然譬如餧驢餧馬只向他道多年接待俗氣也不除且道與古人是同是別舉僧問文殊禪師僧繇為甚麼描志公真不得殊云非但僧繇志公亦描不得僧云志公為甚麼描不得殊云綵繪不將來僧云和尚還描得也無殊云我亦描不得僧云和尚為甚麼描不得殊云渠不苟我顏色教我如何描師拈云文殊與這僧不用一毫顏色你一筆來我一筆去描成寶公真儀儘有十分相似山僧今日正眼觀來只有一處誵訛大衆且道是那一處以手點空云分明記取舉僧侍立白眉霞禪師次眉云可煞熱僧云是眉云只如熱向甚處回避僧云鑊湯爐炭裏回避眉云鑊湯爐炭裏又作麼生回避僧云衆苦不能到師拈云精金不百煉怎見光輝至寶不酬價終同常物這僧雖是父亡母喪家破身窮若不得白眉老人覿靣權𢖍焉知汗馬功高舉僧與疏山造壽塔畢來白疏山山云汝將多少錢與匠人僧云一切在和尚山云為將三文錢與匠人為將兩文錢與匠人為將一文錢與匠人若道得與吾親造塔僧無對後舉似大嶺嶺云還有人道得麼僧云未有人道得嶺云汝回舉似疏山道大嶺聞舉有語云若將三文與匠人和尚今生決定不得塔若將兩文與匠人和尚與匠人共出一隻手若將一文與匠人纍他匠人眉鬚墮落其僧回舉似疏山山具威儀望大嶺禮拜嘆云大嶺古佛放光射至此間雖然如是也是臘月蓮花大嶺後聞此語云我恁麼道也是龜毛長數尺師拈云疏山老漢一生不守本分以致孤露竛竮始自行腳不得被蓋終至委息不得塔安直得尸橫宇宙日炙風吹佛祖不安排至今無處所雖然如是且道三文錢兩文錢一文錢意又作麼生話會山僧今日與疏山相見去也若將三文錢與匠人恁麼也不得若將兩文錢與匠人不恁麼也不得若將一文錢與匠人恁麼不恁麼總不得驀拈拄杖云君往西秦我之東魯舉乾峰上堂舉一不得舉二因緣師拈云舉一不得舉二白雲萬里放過一著落在第二白雲萬里雲門云昨日有人從天台來今朝却往徑山去白雲萬里乾峰云維那明日不得普請白雲萬里有人向山僧四個白雲萬里處薦得管取一生參學事畢雖然如是也是白雲萬里舉趙州諗禪師因僧遊五臺問一婆子臺山路向甚麼處去婆曰驀直去僧便去婆曰好個師僧又恁麼去後有僧舉似師師曰待我去勘過明日師便去問臺山路向甚麼處去婆曰驀直去師便去婆曰好個師僧又恁麼去師歸院謂僧曰臺山婆子為汝勘破了也高峰云檢點將來正是婆子勘破趙州畢竟以何為驗以手指云驀直去師拈云高峰老人恁麼批判未免見處偏枯山僧則不然婆子趙州一人具一隻眼舉白水仁禪師上堂云老僧不欲向聲前句後鼓弄人家男女何故聲且不是聲色且不是色時有僧問如何是聲不是聲水云喚作色得麼僧云如何是色不是色水云喚作聲得麼水復云且道對闍黎話為闍黎説若向這裏會得許你有個入處師拈云聲前薦得早屬顢頇句下承當自傷己命白水老人既不欲聲前句後鼓弄人家男女為甚才被這僧拶著便乃分疏不下泥水通身還知這老子落處麼解空不許離聲色似聽孤猿月下啼舉洞山初行腳時路逢一擔水婆子山索水飲婆云水不妨飲婆有一問須先問過且道水具幾塵山云不具諸塵婆云去休污我水擔師拈云洞山不具諸塵果然喉舌乾枯婆子休污我水終是老婆見解山僧當時若作洞山待婆云水具幾塵但躍翻水桶便行管教這老婆疑著行腳師僧別有長處舉長髭到石頭處頭問甚麼處來髭云嶺南來頭云大𢈔嶺頭一鋪功德還成就也未髭云成就久矣只欠點眼頭云莫要點眼麼髭云便請石頭垂下一足髭便禮拜頭云見甚麼道理便禮拜髭云如紅爐上一點雪石頭休去雪竇云無眼功德有甚點處師拈云雪竇雖是權𢖍在手山僧敢道他稱頭無眼若要與石頭長髭相見何啻三生六十劫舉玄沙見鼓山來作一圓相山云人人出這個不得沙云情知你向驢胎馬腹中作活計山云和尚又作麼生沙云人人出這個不得山云和尚恁麼道得某甲為甚麼道不得沙云我得你不得師拈云二大老與麼説話還有優劣也無若道有未具參學眼在若道無未具參學眼在山僧今日有一轉語與玄沙鼓山相見去也靠拄杖云我得你不得舉趙州和尚一日趙王來不下禪床曰會麼王曰不會州曰自小持齋身已老見人無力下禪床騰騰和尚朝見則天仰視則天曰會麼天曰不會騰騰曰山僧持不語戒忠國師見肅宗帝以手指頭帽子曰會麼帝曰不會國師曰天寒莫怪不下帽子師拈云三大老放去甚危𭣣來太速當時若有出身之路老胡一宗不至掃土雖然山僧恁麼批判只有四字誵訛若人簡點得出許伊天下橫行舉夾山善會禪師初住京口寺因僧問如何是法身山曰法身無相又問如何是法眼山曰法眼無瑕時道吾失笑師遂申請益後散衆參船子大悟後歸聚徒道吾令僧往問如何是法身山曰法身無相又問如何是法眼山曰法眼無瑕僧回舉似吾吾曰這漢此回方徹師拈云夾山前後答語無別道吾因甚肯後不肯前且道誵訛在甚麼處山僧向這裏著得個眼目也要諸方簡點畢竟水須朝海去到頭雲定覓山歸復喝一喝舉石霜會下有二禪客到溈山乃云此間無一人會禪後普請搬柴仰山見二禪客歇將一橛柴問還道得麼俱無對師代云道即不辭只恐無人證明仰曰莫道無人會禪好仰歸舉似溈山曰今日二禪客被慧寂勘破溈山曰甚麼處被子勘破仰舉前話溈山曰寂子又被我勘破師拈云溈仰父子大似乞兒競小利代古有施主婦人入院行衆僧隨年錢僧曰聖僧前著一分婦人曰聖僧年多少僧無對代云適來猶記得南泉和尚遷化陸亘大夫來弔慰院主問大夫何不哭先師大夫曰院主道得亘即哭主無對代云誠如此則先師慶幸江南國主問老宿豫有一頭水牯牛萬里無寸草未審向甚麼處放代云山僧有放處只恐國主不甘聖僧像被屋漏滴有人問既是聖僧為什麼有漏代云示大人相僧問龍牙十二時中如何著力龍牙曰如無手人欲行拳始得代云恁麼則絶後再蘇去也雲門和尚以手入木獅子口顧僧曰咬殺我也相救代云救即不辭恐傍人道是和尚無端禪月詩云禪客相逢只彈指此心能有幾人知大隨和尚舉問禪月如何是此心無對代云所供並是詣實法燈問新到僧近離什麼處曰廬山師拈起香合曰廬山還有這個也無僧無對代云學人今日小出大遇法眼和尚謂小兒曰因子識得爺爺名什麼無對代云但呼和尚若應諾復云某甲今日識得和尚也歸宗柔和尚問僧看什麼經曰寶積經柔曰既是沙門為什麼看寶積僧無對代云此外無有大宋太宗皇帝問僧看什麼經僧云仁王經帝曰既是寡人經為甚麼在卿手裏僧無對代云專為流通帝幸開寶塔問僧卿是甚人僧云塔主帝云寡人塔為什麼卿作主僧無對代云相識滿天下今朝遇至尊帝嘗夢神人報云請陛下發菩提心帝早旦宣問左右街菩提心作麼生發代云謝陛下發菩提心竟帝因僧朝見乃云陛下還記得臣僧麼帝云甚處相見來僧云靈山一別直至如今帝云卿以何為驗僧無對代云但近前義手云請陛下賜鑑帝因僧奏燒却經藏欲乞宣賜帝宣問昔日摩騰不燒如今為甚却燒僧無對代云貧道罪過若云卿是甚麼心行復云也要識得陛下南嶽慧思和尚因志公令人傳語云何不下山教化衆生目視雲漢作麼師云三世諸佛被我一口吞盡何處更有衆生可教化代云再傳語云一釣便上寶志公和尚問一梵僧承聞尊者喚我作屠兒曾見我殺生不僧云見公云有見見無見見不有不無見見若有見見是凡夫見無見見是聲聞見不有不無見見是外道見未審尊者如何見僧云你有此等見耶代云幾乎放過頌古舉世尊未離兜率已降王宮未出母胎度人已畢頌云禍不單行福不雙夜深披雪又遭霜刺形一入膠盆子洗盡長河沒掩藏舉女子出定頌云積翠煙濃撥不開三三兩兩畫樓臺不知已泄春多少猶向杜鵑啼處猜舉殃崛摩羅産難頌云故園花不開躊躇憑欄立多少守花人言藉春風力舉文殊三處度夏頌云一個文殊尚不容那堪千萬靣相同當時直下分明看縱使瞿曇也不中舉廣額屠兒千佛一數因緣頌云殺羊已是賣風流揚下屠刀落二籌何似庖丁逞好手三年不自見全牛舉師子尊者因罽賔國王秉劒因緣玄沙云大小師子尊者頭也不解作得主頌云上大人丘乙己陌路逢論詩禮三百篇篇意若何仲尼一言備之矣江南三月鷓鴣聲有堪聽有不堪聽舉馬祖打車打牛頌云浪湧千層涉者艱撥開煙霧見波瀾車牛直下翻身轉踏碎寒江月一團舉百丈野狐頌云前百丈後百丈秋水長天無兩樣野狐墮脫有來繇陝府灌鐵牛嘉州打大象舉黃檗在鹽官殿上禮佛時唐宣宗為沙彌問曰不著佛求不著法求不著僧求長老禮拜當何所求師曰不著佛求不著法求不著僧求常禮如是事彌曰用禮何為師便掌彌曰太粗生師曰這是甚麼所在説粗説細隨後又掌頌云獅子嚬呻更有誰黃金殿上任施為爪牙未許輕相觸兩掌還他顯大機舉南泉斬貓頌云大用現前全殺活兩堂直得膽魂驚知恩獨有花貓子刃下分明呌一聲舉石鞏射得半個聖人頌云臥月眠雲幾十春一張弓箭不離身相逢用盡生平力中的誰知只半人拗折罷更殷勤孰料三平復問津煙積斷弦遺恨迹寥寥千古亦寒心舉臨濟三度問佛法大意因緣頌云三頓烏藤直似呆大愚一撥眼方開便言佛法無多子脅下還拳痛處來舉玄沙訪三斗菴主才相見主曰莫怪住山年深無坐具師曰人人盡有為甚麼菴主却無曰且坐喫茶師曰菴主元來有在頌云一溪流水抱柴門菜葉招人到白雲只有麻衣遮瘦質且無坐具接高賔寒溫茗共知涼熱豐儉家同識富貧今古閩山菴畔月蘿痕牽影十分明舉興化到大覺為院主因緣頌云驅耕奪食不容情擊碎驪珠光始明是聖是凡俱坐斷太平風月只惺惺舉歸宗與南泉同行一日告別煎茶次泉乃云三十年與兄商量語句彼此以知向後忽有人問畢竟事作麼生常云這一片田好卓菴泉云卓菴且置畢竟事作麼生常乃踢却茶銚便起泉云師兄喫茶了某甲未喫茶常云作這個語話滴水也消不得泉乃休去頌云死貓頭活眼方明三十年來共此情路遠夜長休把火大家吹滅暗中行舉藥山問道吾雲巖枯榮二樹因緣頌云枯榮本屬今時事諸子從他見有差若向藥山言下會當人眼裏事如麻舉黃檗示衆云汝等諸人盡是噇酒糟漢頌云國裏無禪更沒師鷓鴣啼在未萌枝錦衣人只觀花柳打失雙眉自不知舉夾山見船子頌云理釣扁舟三十秋蘋花為餌月為鈎金鱗戲浪清波現吞吐幾回不轉眸施毒手結冤讎離鈎三寸如何道迸出波心忽點頭破船覆却江天曉千古佳聲播未休舉白雲參楊岐悟道因緣頌云一笑全韜殺活行回頭轉腦暗生驚當初只道茅長短燒了元來地不平舉趙州柏樹子頌云披雲帶露十分春任是王維畫不成莫若于今閣筆去水天一色自然清舉巖頭作渡子因一婆子抱一孩兒來問因緣頌云彼此肝腸盡底傾清波明月兩人心歸去罷浪風平君往瀟湘我往秦舉密菴禪師謁應菴菴問如何是正法眼密云破沙盆頌云毛頭星現在當門百怪千妖盡轉恩細嚼爛紅剛一塊翻成沒底破沙盆舉雲門因僧問秋初夏末前程若有人問作麼生祗對師云大衆退後僧云未審過在甚麼處師云還我九十日飯錢來頌云大衆退後韶陽直剖更問如何秋蟲開口久經戰陳老將軍不施寸刃取人首行路難行路難愁腸一片滿目江山舉南院顒禪師問僧名甚麼僧曰普參師曰忽遇屎橛時如何僧曰不審師便打頌云當機覿靣提覿靣當機疾一往與一來猴白遇猴黑舉保福指雪峰上院主山問長慶教中云妙峰頂莫只這便是否長慶云是即是可惜許保福復問鼓山云長慶與麼道意作麼生鼓山云若不與麼紅旗遍野白骨連山頌云是即是兮可惜許放去𭣣來無別理和風搭上玉欄杆知音特地重相舉舉高峰墮枕因緣頌云滄溟一竭見鯤鰲陸地波濤萬丈高鐵壁銀山齊破了賊身無處可潛韜舉興化打克賔頌云話到其中冷似冰更加一頓怨猶深珊瑚枕上兩行淚半是思君半恨君舉趙州訪投子值子擕油瓶歸州云久嚮投子到來只見賣油翁子云汝只見賣油翁且不識投子州云如何是投子子提起油瓶云油油頌云賣油投子實頭翁用處全提殺活宗端的看他同展事白蘋開對蓼花紅舉德山托鉢因緣頌云彩雲影裏仙人現手把紅羅扇遮靣急須著眼看仙人莫看仙人手中扇舉大愚芝和尚示衆曰大家相聚喫莖虀若喚作一莖虀入地獄如箭頌云大家相聚首共喫這莖虀滋味從來有沾脣不許知一堂風冷淡千古月光輝標致余方繼飯香蓴菜𮈔舉中峰本禪師因觀流有省詣高峰求證被峰打趂出既而民間訛傳官選童男女師問云忽有人來問和尚討童男女時如何峰云我但度竹篦子與他師於言下洞然徹法底源頌云痛棒通身不改愁竹篦度處笑擡眸是男是女俱忘却白日長江水自流舉吳山端禪師因尼參師云待來日五更三點入來師侵早紅粉搽面而坐尼入見驚而遂悟頌云老覺情間似太孤五更粧點接師姑雖然已中烽煙計粉面脂唇洗得無復云咦舉天目禮因僧參師問汝名甚麼僧云智虎師退身作怕勢僧擬議師便歸方丈又玄沙同僧入山斫柴見一虎僧曰和尚虎師曰是汝虎頌云道虎抽身天目老見虎卓立謝家郎一般時節全提處大地明明絶覆藏舉趙州問投子大死底人却活是如何子云不許夜行投明須到頌云山邊水邊待月明暫向人間借路行如今還向山邊去只有湖水無路行舉靈雲見桃花悟道玄沙云諦當甚諦當敢保老兄未徹在頌云覆雨翻雲作者機電光石火較遲遲就中明暗交加處只許靈雲備老知舉大宰陸五臺問玉芝和尚東土一千七百善知識即今向甚麼處去了玉指樹鳴蟬云這裏也有一個臺云聲響便是麼玉云喚作聲響即蹉過去也頌云知有何妨異類行緑林深處忽蟬鳴隨聲逐色人無限蹉過當陽古老心舉僧問南臺直上祝融時如何臺云還見麼頌云覿面提持見也麼祝融不在亂雲窩會也未莫蹉跎山色溪光走大哥舉僧問古德如何是毗盧印德云草鞋踏雪僧云不會德云步步成迹頌云赤體條條絶覆藏草鞋踏雪印全彰堪憐岐路忘羊者滯迹追尋失本鄉舉臨濟大師四料簡頌云溪上水流溪下水南山雲起北山雲洞天人影稀相見踈隱鐘聲破曉聞奪人不奪境志公不是間和尚馬祖何曾是作家道泰不傳天子令相邀同喫趙州茶奪境不奪人白牯腹中藏日月蟭螟眼裏納乾坤干門萬戶涼如水塞壑填溝不是塵人境兩俱奪長安門外踏林月花柳叢中上酒樓有意氣時添意氣不風流處也風流人境俱不奪舉佛照因宋孝宗帝問釋迦佛入山六年所成何事照云將謂陛下忘却頌云不枉靈山親囑付萬機暇處扣禪關宗師手眼天然別殺活全韜一語間舉洞山五位君臣頌云正中偏水滿長江月滿天弱柳垂金𮈔細細謝家人上釣魚船偏中正寶殿無人侍亦敬縱橫本自出常情奉重還如法王令正中來玉鏡高懸坐寶臺揮指頓令天地靜蘆花雪月絶纖埃兼中至打雨打風舒意氣玉階出入唱巴歌落魄暫時今又貴兼中到石女懷胎頭帶帽天明生得白頭兒東擲西拋誰敢號舉曹山因僧問清鋭孤貧乞師拯濟師曰鋭闍黎近前來鋭近前師曰泉州白家酒三盞猶道未沾唇頌云孤貧自謂己風流明月堂前乞點眸玉鏡才彰妍醜現泉州白酒二機酬舉汾陽昭禪師示衆有僧問如何是學人著力處師曰嘉州打大象如何是學人轉身處師曰陝府灌鐵牛如何是學人親切處師曰西河弄獅子師乃曰若人會此三句已辨三玄更有三要語在切須薦取頌云一句具三玄一玄具三要咄哉老汾陽拈出猶弄巧看破了道道舉圓悟和尚薰風自南來殿閣生微涼頌云拂拂薰風生夜闌百千諸佛骨毛寒歸去罷無處安長空今古月團圞舉學士宋景濂謁千巖和尚巖問聞公盡一大藏教有諸士曰然曰公耳乎目觀也士曰亦目觀爾曰使目之能觀者公謂誰耶士揚眉向之巖於是相視一笑頌云林下尋師扣板扉揚眉相向頗依俙作家手眼天然別笑裏全韜殺活機舉幻有和尚因僧問如何是佛祖奇特事尚云蝦蟆捕大蟲僧云恁麼則不奇特也尚云貓兒捉老鼠僧禮拜尚便喝僧云和尚為甚放某甲不過尚云老僧有事你且去頌云風前一語定綱宗漢語胡言信亦通末後重提千古令孤燈日下帶朦朧舉湛然澄禪師因僧參師問你行腳事作麼生僧畫一圓相師畫破圓相僧敲桌三下師畫一圓相僧又敲桌二下師又重畫三圓相僧以手抹却師云離此之外別道一句僧擬議師便喝頌云共將胡餅賣街頭與奪從容得自由變局換旗功始立輸他一著不封侯舉孔子曰吾有知乎哉無知也頌云無知即是有知時知即無知任所之萬古長空風月在折旋俯仰更由誰舉仰之彌高鑽之彌堅瞻之在前忽焉在後頌云千紅萬紫總陽春無地能容著眼睛除却華山陳處士誰人不帶是非行音釋繩神陵切音乘索也伺息吏切音四偵候也屹魚乞切音仡山獨立壯武貌覿杜歷切音狄見也竛離呈切音靈竮披經切聘平聲竛竮行不正貌窩烏禾切音倭藏也窟也穴居也
